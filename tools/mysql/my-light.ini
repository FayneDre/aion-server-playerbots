# Light MySQL settings for a machine that also runs the game client and the three servers.
#
# Measured on MySQL 26.7 with the game database loaded (88 MB of data, three servers' pools of 5 connections):
#   the installer's defaults  ~530 MB resident     these settings  ~210 MB resident
#
# How to use: put these lines in the [mysqld] section of the option file (they replace the installer's values of the same name), or
# add "!include <path to this file>" at the end of it. For a MySQL that is not MySQL 8 or later (MariaDB), leave out mysqlx and
# skip-log-bin: MariaDB does not know them and refuses to start on an option it does not know.
#
# What each line gives up, so that nobody turns one back on without knowing the price:
#   performance_schema  the server's own instrumentation (about 100-150 MB). Nothing here reads it; switch it on to profile MySQL itself.
#   mysqlx              the X protocol on port 33060. The servers speak the classic protocol on 3306 only.
#   skip-log-bin        the binary log: it grew by 5 GB in about three weeks and nothing replays it; the safety net is the dump of backup-db.ps1.
#   max_connections     the three servers keep 5 connections each; 40 leaves room for a client and the tools.
#   table_open_cache    the game schema has 63 tables.
#   buffer pool         128 MB holds the whole game database; one instance is enough at that size.

[mysqld]
performance_schema=OFF
mysqlx=OFF
skip-log-bin
max_connections=40
table_open_cache=400
innodb_buffer_pool_size=128M
innodb_buffer_pool_instances=1
innodb_log_buffer_size=4M
temptable_max_ram=32M
tmp_table_size=16M
