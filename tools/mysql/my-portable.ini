# The option file of the portable MySQL an install carries, in <install>\mysql. setup-mysql.ps1 fills the three @...@ and appends the light settings
# of my-light.ini (memory), so that this file keeps only what makes the database this server's.
#
#   bind-address            the database answers this machine only: it is never offered to a network.
#   lower_case_table_names  as on the development machine (Windows file names): MySQL fixes it when the data folder is made, so it is here from the start.
#   utf8mb4                 what the schemas are written in.
#   innodb_flush_log_at_trx_commit=1  every commit reaches the disk: a character saved is a character kept, a power cut included.

[client]
port=@PORT@
default-character-set=utf8mb4

[mysqld]
basedir="@BASEDIR@"
datadir="@DATADIR@"
port=@PORT@
bind-address=127.0.0.1
character-set-server=utf8mb4
default-storage-engine=INNODB
lower_case_table_names=1
sql-mode="ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
log-error="mysql.err"
slow-query-log=0
innodb_flush_log_at_trx_commit=1
innodb_redo_log_capacity=100M
max_allowed_packet=64M
