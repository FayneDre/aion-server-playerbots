#
# ----------------------------
# Playerbot config's:
# ----------------------------

# Whether bots run at all.
# Turning this off leaves every bot character in the database, simply unspawned.
# Default: true
gameserver.playerbot.enable = true

# Which maps to populate, carried out on startup and only for a map that has nobody
# on it yet, so a fresh installation populates itself once and later starts do nothing.
#
#   auto    every open world map of both races. The race of each, and how many people
#           it holds, are read from the map itself. A map whose navmesh is missing is
#           built before the server opens.
#   <list>  <mapId>:<count>[:<race>], separated by semicolons, when you want to choose.
#           A count of 0 means "as many as the region asks for", worked out from its
#           own civilian npcs — which is what auto uses and almost always what you want.
#           Without a race each place names its own, which is what contested ground
#           (Reshanta, Silentera, Kaldor, Levinshor) and Balaurea need; auto skips those.
#           Example: 210010000:0:ELYOS;220010000:0:ASMODIANS;400010000:0
#   empty   populate nothing.
#
# Default: Poeta alone, which is the map this has been proven on
gameserver.playerbot.populate = 210010000:0:ELYOS

# When bots in a group stand where their class belongs in a fight: tank on the far side, melee
# behind the enemy, ranged classes back from it. AUTO against bosses only (hero and legendary
# monsters), STANDARD never, SPREAD always. Otherwise they walk straight to the enemy.
# A line with the share of well placed samples is logged every 200 samples either way.
# Default: AUTO
gameserver.playerbot.positioning = AUTO

# Whether a bot walking to another place of its own accord flies there, when the trip is 25 to 300 m, both ends are in a fly zone and the air between is
# clear. About half of such trips fly. Off, bots fly only when walking is proved impossible, to follow a flying player, and to get home when stuck.
# Default: true
gameserver.playerbot.ambient.flight = true

# Whether a bot strolling or loitering within 150 m of a real player now and then (about one stroll in twenty) glides off a ledge of 8 to 40 m to the ground below it, for the look of it.
# Bots no player is near never do. Off, bots glide only where walking is proved impossible and to follow a gliding player.
# Default: true
gameserver.playerbot.ambient.glide = true

# The language of everything the bots say in the chat channels (Region, Trade, Find Group) and by shout in the capitals: FR or EN.
# The words are in game-server/data/bot_chat (chat_fr.txt, chat_en.txt), packaged in the jar. //bot speech lang FR|EN changes it until the next start.
# Default: FR
gameserver.playerbot.chat.language = FR

# How much of each region's countryside is awake (villages are always full):
#   AUTO   follows the players: all of it on a map somebody plays on (and for five minutes after), a fifth elsewhere, a twentieth with nobody online.
#   FIXED  every map holds density.percent of its busy countryside whoever is online, so the world is the same seen or unseen.
#   FLOOR  as AUTO, but no map ever falls below density.percent: full where somebody plays, at least the percent everywhere else.
# The percent is 0 to 100 (0 keeps one hunter a region). Memory is the limit: measure a high percent before keeping it.
# Read at every review of the director (30 s), so //reload config applies it. Default: AUTO, 30
gameserver.playerbot.density.mode = AUTO
gameserver.playerbot.density.percent = 30

# Whether bots attack players of the other race (real players and other bots) where the game makes them enemies, which is a PvP zone. Which players
# a bot picks, and how readily, are the pvp.share.* and pvp.level_* options below. Off, no bot ever picks a player as a target.
# Default: true (decided by the tester on 31 October: on by default)
gameserver.playerbot.pvp.enable = true

# The auction house (docs/capitals/plans/auction-house-plan.md): the server lists items in each race's broker, keeps their number near a target per category and
# quality, settles and relists, and buys players' listings priced in range. A house character per race is created at the first start (never logged in).
# Read at startup. Default: true (decided by the tester on 31 October: on by default)
gameserver.playerbot.broker.enable = true
# Listings kept per race (6000 to 12000), minutes between two passes, and minutes over which an empty house is first filled.
gameserver.playerbot.broker.size = 6000
gameserver.playerbot.broker.interval = 15
gameserver.playerbot.broker.fill_minutes = 10
# Shares (weights) of the client's top level categories, and of the qualities inside each one. Names as in BrokerItemMask and ItemQuality.
gameserver.playerbot.broker.category_shares = WEAPON:12;ARMOR:16;ACCESSORY:8;SKILL_RELATED:4;HOME_DECOR:1;FURNITURE:2;CRAFT:22;CONSUMABLES:30;OTHER:5
gameserver.playerbot.broker.quality_shares = COMMON:25;RARE:30;LEGEND:25;UNIQUE:12;EPIC:7;MYTHIC:1
# Template ids never listed (and withdrawn if found listed), separated by commas.
gameserver.playerbot.broker.blacklist =
# The buyer: a listing of a player priced within the known range (top of the range + tolerance %) is bought after a random delay of min to max minutes,
# at most max_per_pass per pass; the daily kinah ceilings are in all, per seller and per item kind. No known price, no purchase.
gameserver.playerbot.broker.buyer.enable = true
gameserver.playerbot.broker.buyer.interval = 60
gameserver.playerbot.broker.buyer.max_per_pass = 5
gameserver.playerbot.broker.buyer.min_delay = 1
gameserver.playerbot.broker.buyer.max_delay = 5
gameserver.playerbot.broker.buyer.tolerance = 5
gameserver.playerbot.broker.buyer.daily_kinah = 200000000
gameserver.playerbot.broker.buyer.daily_kinah_per_player = 30000000
gameserver.playerbot.broker.buyer.daily_kinah_per_item = 50000000

# Whether bots speak in the chat channels and by shout. //bot speech off silences them further, until the next start.
# Default: true
gameserver.playerbot.chat.enable = true

# How readily a bot starts a fight with a player of the other race, as relative shares (25, 25 and 50: a quarter, a quarter and a half).
# Fighters attack on sight, opportunists only a weakened or lower level player, peaceful bots only defend themselves.
# Default: 25, 25, 50
gameserver.playerbot.pvp.share.fighter = 25
gameserver.playerbot.pvp.share.opportunist = 25
gameserver.playerbot.pvp.share.peaceful = 50
# How far above and beneath its own level a bot picks a fight with a player. Default: 3 and 6
gameserver.playerbot.pvp.level_above = 3
gameserver.playerbot.pvp.level_below = 6

# What a world bot earns, as a percent of the official experience rate (the players' rates do not apply to it): from monsters alone, in a group
# (never less than 1: zero is no experience at all), and from player kills. A bot in a player's group follows the player's rate.
# Default: 1, 1, 100
gameserver.playerbot.xp.solo = 1
gameserver.playerbot.xp.group = 1
gameserver.playerbot.xp.pvp = 100
