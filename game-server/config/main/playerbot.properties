#
# ----------------------------
# Playerbot config's:
# ----------------------------

# Whether bots run at all.
# Turning this off leaves every bot character in the database, simply unspawned.
# Default: true
gameserver.playerbot.enable = true

# Maps to keep populated, as <mapId>:<count>:<race>, separated by semicolons.
# Carried out on startup, and only for a map that has nobody on it yet, so a fresh
# installation is populated once and later starts do nothing.
# A generated navmesh (tools/navmesh.ps1 <mapId>) is strongly recommended first:
# without one the bots there walk without a plan and get stuck on scenery.
# Example: 210010000:45:ELYOS;220010000:45:ASMODIANS
# Default: empty, meaning populate nothing
gameserver.playerbot.populate = 210010000:45:ELYOS
